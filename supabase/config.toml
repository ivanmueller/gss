# Supabase CLI settings for the local and CI database only. The hosted gss-staging
# project is configured in the Supabase dashboard; migrations reach it from the
# Deploy staging workflow (docs/DECISIONS.md, 2026-10-27).
project_id = "gss"

[api]
# The Data API exposes only these schemas. Application tables live in the private
# `app` schema, which is deliberately not listed.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

# Mirrors the hosted gss-staging settings the owner applies in the dashboard:
# no self sign-up (administrators create users) and TOTP two-factor enabled.
[auth]
enabled = true
site_url = "http://127.0.0.1:8787"
# Blocks every self sign-up; administrators still create users.
enable_signup = false

[auth.email]
# Keep true: in the CLI this switches email/password sign-in itself on or off.
enable_signup = true
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
