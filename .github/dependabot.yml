version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for non-breaking updates; majors still arrive one by one.
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports typescript <6.1 (docs/DECISIONS.md, 2026-10-26).
      # Remove when it supports newer releases.
      - dependency-name: typescript
        versions: ['>=6.1.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
