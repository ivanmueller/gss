name: Load ST37 wells

# Run by hand from the Actions tab (Actions → Load ST37 wells → Run workflow). Downloads the AER's
# ST37 list of wells (its geodatabase, about 1.3 GB), cuts out one formation whole (the Duvernay,
# F-252) or one area (F-243 part 4) and loads its wells, with their status and drilled paths,
# into the oil and gas database (petroleum-staging), replacing that play's wells in one transaction
# (the wells of other plays stay; F-256), with the names of fields and pools from the AER's ST103 list
# (docs/FEATURES_OIL_GAS.md). A formation's wells are those in its pools and those whose licence
# aims at it (Petrinex's public Well Licence file); a well with no drilled path yet gets its
# planned bottom hole from the province's township grid (F-243 part 4b).
#
# The AER's and Petrinex's data is used on the owner's decisions (docs/DECISIONS.md, 2026-11-19
# and 2026-11-20): it stays on the runner and in that database, never in the repository or the
# run's logs or artifacts. The load is refused if grain's and the oil and gas databases together
# would pass 450 MB (the free plan's limit is shared by both).
on:
  workflow_dispatch:
    inputs:
      formation:
        description: Load one formation whole, or "area" for the rectangle below
        type: choice
        options:
          - duvernay
          - area
        default: duvernay
      west:
        description: West edge (longitude), for "area" only
        default: '-113.95'
      south:
        description: South edge (latitude), for "area" only
        default: '53.12'
      east:
        description: East edge (longitude), for "area" only
        default: '-113.25'
      north:
        description: North edge (latitude), for "area" only
        default: '53.48'

permissions:
  contents: read

concurrency:
  group: load-st37
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the area
        env:
          WEST: ${{ inputs.west }}
          SOUTH: ${{ inputs.south }}
          EAST: ${{ inputs.east }}
          NORTH: ${{ inputs.north }}
        run: |
          # Numbers in Alberta, west of east and south of north; no other text reaches a command.
          num='^-?[0-9]{1,3}(\.[0-9]{1,6})?$'
          for v in "$WEST" "$SOUTH" "$EAST" "$NORTH"; do
            [[ "$v" =~ $num ]] || { echo "::error::Each edge must be a number such as -113.95."; exit 1; }
          done
          node -e '
            const [w, s, e, n] = process.argv.slice(1).map(Number);
            const ok = w >= -120.1 && e <= -109.9 && s >= 48.9 && n <= 60.1 && w < e && s < n;
            if (!ok) { console.log("::error::The area must lie in Alberta, west of east and south of north."); process.exit(1); }
          ' -- "$WEST" "$SOUTH" "$EAST" "$NORTH"
      - name: Check the databases
        env:
          PETROLEUM_STAGING_DB_URL: ${{ secrets.PETROLEUM_STAGING_DB_URL }}
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          # Only ever petroleum-staging, as Deploy staging checks it (F-247-1-R10-02).
          ref=ubgyatbzjctsgzcsvwgc
          pooler="^postgres(ql)?://postgres\.${ref}:[^@:/?#]+@aws-1-us-east-2\.pooler\.supabase\.com:5432/postgres$"
          direct="^postgres(ql)?://postgres:[^@:/?#]+@db\.${ref}\.supabase\.co:5432/postgres$"
          if ! [[ "$PETROLEUM_STAGING_DB_URL" =~ $pooler || "$PETROLEUM_STAGING_DB_URL" =~ $direct ]]; then
            echo "::error::PETROLEUM_STAGING_DB_URL is not petroleum-staging's postgres login in the expected form; nothing was loaded."
            exit 1
          fi
          if [ -z "$SUPABASE_STAGING_DB_URL" ]; then
            echo "::error::SUPABASE_STAGING_DB_URL is not set: grain's database size cannot be checked, so nothing was loaded."
            exit 1
          fi
          version=$(psql "$PETROLEUM_STAGING_DB_URL" -tA -c "select petro.schema_version()")
          if [ "$version" -lt 12 ]; then
            echo "::error::The oil and gas database is at schema version $version; run Deploy staging first (it needs 12)."
            exit 1
          fi
          grain=$(psql "$SUPABASE_STAGING_DB_URL" -tA -c "select pg_database_size(current_database())")
          echo "GRAIN_BYTES=$grain" >> "$GITHUB_ENV"
          echo "Grain's database: $((grain / 1048576)) MB."
      - name: Download the AER's ST37 list
        run: |
          mkdir -p "$RUNNER_TEMP/st37"
          cd "$RUNNER_TEMP/st37"
          url=https://static.aer.ca/prd/documents/sts/st37/ST_37_GeoDB.zip
          curl -sSfL --retry 3 -D headers.txt -o st37.zip "$url"
          # The file's own date, when the AER sends one.
          modified=$(grep -i '^last-modified:' headers.txt | cut -d' ' -f2- | tr -d '\r' || true)
          date=$(date -u -d "$modified" +%F 2>/dev/null || echo -)
          echo "SOURCE_URL=$url" >> "$GITHUB_ENV"
          echo "SOURCE_DATE=$date" >> "$GITHUB_ENV"
          echo "Downloaded $(( $(stat -c %s st37.zip) / 1048576 )) MB, dated $date."
          unzip -q st37.zip -x '*/ST_37_Wells.gdb_zip.zip'
          rm st37.zip
      - name: Cut out the area
        if: inputs.formation == 'area'
        env:
          WEST: ${{ inputs.west }}
          SOUTH: ${{ inputs.south }}
          EAST: ${{ inputs.east }}
          NORTH: ${{ inputs.north }}
        run: |
          cd "$RUNNER_TEMP/st37"
          gdb=$(find . -maxdepth 2 -type d -name '*.gdb' | head -1)
          [ -n "$gdb" ] || { echo "::error::No geodatabase in the AER's file."; exit 1; }
          mkdir -p out
          cut_layer() {
            # $1: layer, $2: output, $3: XY, or XYZ for the paths, whose every point has an
            # elevation (the 3D view, F-261). The loader thins the drilled paths.
            docker run --rm -v "$PWD:/data" ghcr.io/osgeo/gdal:alpine-small-3.10.0 \
              ogr2ogr -f GeoJSON -t_srs EPSG:4326 -dim "$3" \
              -spat "$WEST" "$SOUTH" "$EAST" "$NORTH" -spat_srs EPSG:4326 \
              "/data/out/$2" "/data/$gdb" "$1"
          }
          cut_layer ST37_Surface_Hole_NAD83_10TM_AEP_Forest surface.geojson XY
          cut_layer ST37_Bottom_Hole_NAD83_10TM_AEP_Forest bottom.geojson XY
          cut_layer ST37_Production_String_NAD83_10TM_AEP_Forest strings.geojson XY
          cut_layer ST37_Well_Geometry_NAD83_10TM_AEP_Forest paths.geojson XYZ
          ls -la out
      - name: Cut out the formation
        if: inputs.formation != 'area'
        env:
          # One of the workflow's own choices, never free text.
          FORMATION: ${{ inputs.formation }}
        run: |
          cd "$RUNNER_TEMP/st37"
          gdb=$(find . -maxdepth 2 -type d -name '*.gdb' | head -1)
          [ -n "$gdb" ] || { echo "::error::No geodatabase in the AER's file."; exit 1; }
          mkdir -p out
          case "$FORMATION" in
            # The AER's formation codes 7280 to 7288 (ST37_FORMATIONS, packages/domain/src/st37.ts).
            duvernay) pools="Pool_Code >= 728000 AND Pool_Code <= 728899" ;;
            *) echo "::error::Unknown formation."; exit 1 ;;
          esac
          gdal() {
            # $1: XY, or XYZ for the paths, whose every point has an elevation (the 3D view,
            # F-261).
            dim=$1
            shift
            docker run --rm -v "$PWD:/data" ghcr.io/osgeo/gdal:alpine-small-3.10.0 \
              ogr2ogr -f GeoJSON -t_srs EPSG:4326 -dim "$dim" "$@"
          }
          # 1. The production strings in the formation's pools.
          gdal XY -where "$pools" /data/out/pool.geojson "/data/$gdb" \
            ST37_Production_String_NAD83_10TM_AEP_Forest
          # 2. Petrinex's public Well Licence file (a zip in a zip): the licences aimed at it.
          curl -sSfL --retry 3 -o licence.zip \
            'https://www.petrinex.gov.ab.ca/publicdata/API/Files/AB/Infra/Well%20Licence/CSV'
          unzip -q -o licence.zip -d licence
          unzip -q -o licence/*.zip -d licence
          csv=$(find licence -maxdepth 1 -iname '*.csv' | head -1)
          [ -n "$csv" ] || { echo "::error::No table in Petrinex's Well Licence file."; exit 1; }
          node --experimental-strip-types "$GITHUB_WORKSPACE/scripts/load-st37.js" pick \
            "$FORMATION" out/pool.geojson "$csv" out
          # 3. Every record of those licences, from the four layers.
          cut_layer() {
            gdal "$3" -dialect SQLITE -sql "select * from $1 where trim(Well_Licence_Number) in (select licence from '/data/out/licences.csv'.licences)" \
              "/data/out/$2" "/data/$gdb"
          }
          cut_layer ST37_Surface_Hole_NAD83_10TM_AEP_Forest surface.geojson XY
          cut_layer ST37_Bottom_Hole_NAD83_10TM_AEP_Forest bottom.geojson XY
          cut_layer ST37_Production_String_NAD83_10TM_AEP_Forest strings.geojson XY
          cut_layer ST37_Well_Geometry_NAD83_10TM_AEP_Forest paths.geojson XYZ
          ls -la out
      - name: Load the wells
        env:
          PETROLEUM_STAGING_DB_URL: ${{ secrets.PETROLEUM_STAGING_DB_URL }}
          FORMATION: ${{ inputs.formation }}
          WEST: ${{ inputs.west }}
          SOUTH: ${{ inputs.south }}
          EAST: ${{ inputs.east }}
          NORTH: ${{ inputs.north }}
        run: |
          if [ "$FORMATION" = area ]; then
            node --experimental-strip-types scripts/load-st37.js "$RUNNER_TEMP/st37/out" \
              "$WEST" "$SOUTH" "$EAST" "$NORTH" "$SOURCE_URL" "$SOURCE_DATE" "$GRAIN_BYTES" \
              > "$RUNNER_TEMP/st37/load.sql"
          else
            # A formation is loaded whole: the edges are Alberta's.
            node --experimental-strip-types scripts/load-st37.js "$RUNNER_TEMP/st37/out" \
              -120.1 48.9 -109.9 60.1 "$SOURCE_URL" "$SOURCE_DATE" "$GRAIN_BYTES" "$FORMATION" \
              > "$RUNNER_TEMP/st37/load.sql"
          fi
          psql "$PETROLEUM_STAGING_DB_URL" -q -f "$RUNNER_TEMP/st37/load.sql"
      - name: Load the names of fields and pools
        env:
          PETROLEUM_STAGING_DB_URL: ${{ secrets.PETROLEUM_STAGING_DB_URL }}
        run: |
          # The AER's ST103 field and pool list: a well's field code and pool code name its field
          # and pool (F-256). Replaced whole in one transaction.
          cd "$RUNNER_TEMP/st37"
          url=https://static.aer.ca/prd/data/codes/FieldPoolList.txt
          curl -sSfL --retry 3 -D codes-headers.txt -o FieldPoolList.txt "$url"
          modified=$(grep -i '^last-modified:' codes-headers.txt | cut -d' ' -f2- | tr -d '\r' || true)
          date=$(date -u -d "$modified" +%F 2>/dev/null || echo -)
          node --experimental-strip-types "$GITHUB_WORKSPACE/scripts/load-st37.js" codes             FieldPoolList.txt "$url" "$date" > codes.sql
          psql "$PETROLEUM_STAGING_DB_URL" -q -f codes.sql
      - name: Remove the AER's files from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/st37"
