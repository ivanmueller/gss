name: Set up Hyperdrive (staging)

# Run by hand from the Actions tab. Creates or updates the Cloudflare Hyperdrive
# configuration the staging Worker uses to reach Supabase (docs/DECISIONS.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hyperdrive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Create or update the Hyperdrive configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_HYPERDRIVE_URL: ${{ secrets.SUPABASE_HYPERDRIVE_URL }}
        run: node scripts/setup-hyperdrive.js
