name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Lets the workflow pass with a notice until the owner adds the secrets.
  # In the staging environment like the deploy itself (F-247-1-R16-01): every job that receives a
  # staging credential (Cloudflare's token included, which deploys the Worker and manages its
  # Hyperdrive connections) is one GitHub allows from main only, whatever a branch's copy of this
  # file says. Secrets of the environment take precedence over repository secrets of the same
  # name; the credentials belong in the environment only (README, "The oil and gas database").
  preflight:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      database: ${{ steps.check.outputs.database }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          # Staging is only ever deployed from main, by hand too (F-247-1-D2-01): a run started on
          # another branch would apply that branch's unreviewed migrations. A branch
          # that edits this file is stopped by GitHub itself: the staging environment allows main
          # only, and the oil and gas credentials are secrets of that environment.
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Deploy staging runs from main only; this run was started on $GITHUB_REF_NAME."
            exit 1
          fi
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" != push ]; then
            # A run by hand is a check, so it never ends green without deploying (F-247-1-R8-01).
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; nothing can be deployed or checked."
            exit 1
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; staging deploy skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$SUPABASE_STAGING_DB_URL" ]; then
            echo "database=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SUPABASE_STAGING_DB_URL is not set; staging database migrations skipped."
            echo "database=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    env:
      # The oil and gas database's migration login is a secret of the staging environment only
      # (never a repository secret), so only this job, which GitHub allows from main alone, can
      # read it (F-247-1-R15-01). Whether it exists, for the steps' conditions.
      HAS_PETROLEUM: ${{ secrets.PETROLEUM_STAGING_DB_URL != '' }}
    steps:
      - name: Oil and gas migration login present?
        run: |
          if [ "$HAS_PETROLEUM" = true ]; then
            exit 0
          elif [ "$GITHUB_EVENT_NAME" != push ]; then
            # A run by hand proves the oil and gas side, migrations included; the box "not
            # connected yet" waives only the Worker's binding (F-247-1-R13-02).
            echo "::error::PETROLEUM_STAGING_DB_URL is not set in the staging environment; the oil and gas migrations cannot be applied or checked."
            exit 1
          fi
          echo "::notice::PETROLEUM_STAGING_DB_URL is not set in the staging environment; oil and gas database migrations skipped."
      - uses: actions/checkout@v7
        with:
          # The commit before this push, to see whether it changes the PETROLEUM binding.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Public values, the same as env.staging.vars in apps/api/wrangler.jsonc. The Mapbox
      # token is public too (built into the page and restricted to the app's address in
      # Mapbox), but lives in a secret so it is not in Git and can be replaced; without it
      # the map page lists locations and explains how to add one (README, "Map").
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: https://nfwizbcpjpqxdoojfbdr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_4gRcidcCPr7dsdATHL57nQ_QNY0SNAc
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
      # Migrations go first so the Worker never runs against an older schema.
      - uses: supabase/setup-cli@v3
        if: needs.preflight.outputs.database == 'true' || env.HAS_PETROLEUM == 'true'
        with:
          version: 2.122.0
      - name: Apply database migrations
        if: needs.preflight.outputs.database == 'true'
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_STAGING_DB_URL"
      # The oil and gas database (petroleum-staging, F-247-1-D1-02, R3-01, R3-02): every deploy
      # applies whatever of its migrations it has not run yet (nothing when it is up to date), so
      # no migration is ever skipped. On a release from a push, a failure (that database paused or
      # unreachable) is a warning and grain still deploys: the Worker's oil and gas routes check
      # that database's schema version themselves and answer "not ready" until it catches up, and
      # the next deploy tries again. On a run started by hand (Actions → Deploy staging → Run
      # workflow), the oil and gas database must be reachable, migrated and ready, or the run fails.
      - name: Apply oil and gas database migrations
        id: petroleum
        if: env.HAS_PETROLEUM == 'true'
        env:
          PETROLEUM_STAGING_DB_URL: ${{ secrets.PETROLEUM_STAGING_DB_URL }}
        # At most 5 minutes (a lock held on that database must not run the job into its
        # 15-minute limit before grain's Worker deploys, F-247-1-R4-02); running out counts as a
        # failure below.
        run: |
          # Only ever petroleum-staging (F-247-1-R10-02, R11-01): the whole URL must be one of its
          # two forms, exactly, with nothing after the database name (no options) and a
          # percent-encoded password (no @ : / ? #): the session pooler as postgres.<ref>, or the
          # direct host db.<ref>.supabase.co as postgres. Never prints the URL. A URL that is not
          # one of these is applied nowhere: a warning on a push, so grain still deploys
          # (F-247-1-R11-02), a failure on a run by hand.
          ref=ubgyatbzjctsgzcsvwgc
          pooler="^postgres(ql)?://postgres\.${ref}:[^@:/?#]+@aws-1-us-east-2\.pooler\.supabase\.com:5432/postgres$"
          direct="^postgres(ql)?://postgres:[^@:/?#]+@db\.${ref}\.supabase\.co:5432/postgres$"
          if ! [[ "$PETROLEUM_STAGING_DB_URL" =~ $pooler || "$PETROLEUM_STAGING_DB_URL" =~ $direct ]]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "::warning::PETROLEUM_STAGING_DB_URL is not petroleum-staging's postgres login in the expected form; no oil and gas migration was applied, grain deploys."
              echo "applied=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::PETROLEUM_STAGING_DB_URL is not petroleum-staging's postgres login in the expected form; nothing was applied."
            exit 1
          fi
          if timeout 300 supabase --workdir petroleum db push --db-url "$PETROLEUM_STAGING_DB_URL" --yes; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::warning::The oil and gas database's migrations could not be applied (paused or unreachable?); grain deploys, the next deploy tries again."
            echo "applied=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The oil and gas database's migrations could not be applied."
            exit 1
          fi
      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm --filter @grain/api exec wrangler deploy --env staging | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::No workers.dev URL found in the wrangler output."
            exit 1
          fi
          fetch() { curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$@"; }

          health=$(fetch "$URL/api/v1/health")
          echo "/api/v1/health -> $health"
          test "$health" = '{"status":"ok","service":"api"}'

          page=$(fetch "$URL/")
          [[ "$page" == *'<div id="root"></div>'* ]] || { echo "::error::/ did not return the web app."; exit 1; }
          echo "/ -> web app"

          # API paths other than /health must reach the Worker and require sign-in (401),
          # never fall back to the web app.
          for path in /api/v1/me /api/v1/does-not-exist; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H 'Accept: text/html' -H 'Sec-Fetch-Mode: navigate' "$URL$path")
            echo "$path (no sign-in) -> $status"
            test "$status" = 401
          done
