name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Lets the workflow pass with a notice until the owner adds the secrets.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      database: ${{ steps.check.outputs.database }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; staging deploy skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$SUPABASE_STAGING_DB_URL" ]; then
            echo "database=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SUPABASE_STAGING_DB_URL is not set; staging database migrations skipped."
            echo "database=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # Migrations go first so the Worker never runs against an older schema.
      - uses: supabase/setup-cli@v1
        if: needs.preflight.outputs.database == 'true'
        with:
          version: 2.122.0
      - name: Apply database migrations
        if: needs.preflight.outputs.database == 'true'
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_STAGING_DB_URL"
      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm --filter @grain/api exec wrangler deploy --env staging | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::No workers.dev URL found in the wrangler output."
            exit 1
          fi
          fetch() { curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$@"; }

          health=$(fetch "$URL/api/v1/health")
          echo "/api/v1/health -> $health"
          test "$health" = '{"status":"ok","service":"api"}'

          page=$(fetch "$URL/")
          [[ "$page" == *'<div id="root"></div>'* ]] || { echo "::error::/ did not return the web app."; exit 1; }
          echo "/ -> web app"

          # Unknown API paths must reach the Worker (404), not fall back to the web app.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Accept: text/html' -H 'Sec-Fetch-Mode: navigate' "$URL/api/v1/does-not-exist")
          echo "/api/v1/does-not-exist -> $status"
          test "$status" = 404
