name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Supabase's local ports (54320 to 54329) sit inside Linux's range for outgoing connections
      # (32768 to 60999), so a download can take 54322 just before the database binds it, and
      # nothing is listening there (runs #342, #357 and #367: "address already in use", with no
      # listener on the port). Reserved first, before any download, so they are never handed out.
      - name: Keep Supabase's ports out of outgoing connections
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      # Throwaway local Supabase with its sign-in service: every migration is applied
      # from scratch. Services the tests do not use are left out.
      # The runner has twice refused the database's port as already in use (main runs #342 and
      # #357, before any test ran): it says what holds the port, stops what started, and tries
      # again, up to 3 times. A start that never succeeds still fails the job at `status`.
      - name: Start local Supabase
        run: |
          for attempt in 1 2 3; do
            if supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector; then
              break
            fi
            echo "::warning::Supabase did not start (attempt $attempt of 3); what holds port 54322:"
            # Every state, not only listeners: an outgoing or closing connection can hold it too.
            sudo ss -tanp 'sport = :54322' || true
            docker ps -a --format '{{.Names}} {{.Status}} {{.Ports}}' || true
            supabase stop --no-backup || true
            sleep 15
          done
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
      # Build the web app and configure the local Worker against that Supabase.
      # These are the CLI's well-known local development keys, not secrets.
      - name: Point the app at local Supabase
        run: |
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          for name in API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::supabase status gave no $name; it gave: $(cut -d= -f1 "$RUNNER_TEMP/supabase.env" | tr '\n' ' ')"
              exit 1
            fi
          done
          APP_API_URL="postgresql://app_api:ci-only-app-api-password@127.0.0.1:54322/postgres"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_DATABASE_URL=$DB_URL"
            echo "API_TEST_ADMIN_DATABASE_URL=$DB_URL"
            echo "API_TEST_DATABASE_URL=$APP_API_URL"
            # The staging Worker's Hyperdrive binding points at the local database in wrangler dev.
            echo "CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE=$APP_API_URL"
          } >> "$GITHUB_ENV"
          # SUPABASE_SECRET_KEY lets the Team page make logins (the local CLI's well-known key).
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\nDATABASE_URL=%s\nSUPABASE_SECRET_KEY=%s\n' \
            "$API_URL" "$ANON_KEY" "$APP_API_URL" "$SERVICE_ROLE_KEY" > apps/api/.dev.vars.staging
      - run: pnpm build
      # Runs before app_api has a login: the suite checks migrations never grant one.
      - name: Database tests
        run: supabase test db
      # The API's database role gets a login for this throwaway database only.
      - name: Enable the app_api login (local database only)
        run: >-
          psql "$API_TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -q
          -c "alter role app_api with login password 'ci-only-app-api-password'"
      # The API's database code, as app_api, against the same database.
      - name: API database tests
        run: pnpm --filter @grain/api test:db
      - name: Install Playwright Chromium
        run: pnpm --filter @grain/e2e exec playwright install --with-deps chromium
      # Browser tests against the built app served by the staging Worker config.
      - name: Browser tests
        run: pnpm --filter @grain/e2e e2e
