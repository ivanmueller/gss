name: Approval withdrawn

# The owner approves a governance change by an `approve-merge <commit>` line, as a comment or a review,
# and the label owner-approved-merge (scripts/review-approval.js, F-156). Editing, deleting or
# dismissing one of the owner's comments or reviews can end that approval (F-156-D1-01): this then
# re-checks every open pull request carrying the label against GitHub's records and, where the
# approval no longer holds, takes the label off, turns automatic merging off and runs the Merge policy
# again once any run in progress has finished (scripts/review-withdraw-approval.js). It only ever
# cancels an approval, never grants one. Both triggers run main's own copy with its own token: a
# comment's events directly, a review's through review-changed.yml finishing (F-156-R2-02). No pull
# request code is checked out or run.
on:
  issue_comment:
    types: [edited, deleted]
  workflow_run:
    workflows: [Review changed]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: approval-withdrawn
  cancel-in-progress: false

jobs:
  withdraw:
    name: Withdraw approvals that no longer hold
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner) ||
      github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Turning automatic merging off is a merge action: GitHub refuses it without contents: write
      # (F-152). Branch protection still stops this token from pushing to main.
      contents: write
      pull-requests: write
      # To take the label off and say why, in a comment.
      issues: write
      # To run the Merge policy again on the head commit.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
    steps:
      # main's own copy of the scripts.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Withdraw approvals that no longer hold
        run: node scripts/review-withdraw-approval.js "$REPO" "$OWNER"
