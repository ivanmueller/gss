name: Load pipelines

# Run by hand from the Actions tab (Actions → Load pipelines → Run workflow), after "Load ST37
# wells". Reads the Alberta Energy Regulator's pipeline file as a shapefile
# (https://static.aer.ca/prd/data/pipeline/Pipelines_SHP.zip) and loads the segments that touch
# one play's area (the Duvernay first; the owner, 2026-11-22) into the oil and gas database
# (petroleum-staging), replacing the whole copy in one transaction (F-249,
# docs/FEATURES_OIL_GAS.md). The area is the box that holds the play's wells and its outline, as
# for "Load land", "Load land sales" and "Load facilities".
#
# The AER's data, on the conditions recorded for its ST37 list (docs/DECISIONS.md, 2026-11-19:
# members only, nothing exported). The file stays on the runner and in that database, never in the
# repository or the run's logs or artifacts. The load is refused if grain's and the oil and gas
# databases together would pass 400 MB (the free plan's limit is shared by both).
on:
  workflow_dispatch:
    inputs:
      formation:
        description: The play whose wells mark the area
        type: choice
        options:
          - duvernay
        default: duvernay

permissions:
  contents: read

concurrency:
  group: load-pipelines
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the databases
        env:
          PETROLEUM_STAGING_DB_URL: ${{ secrets.PETROLEUM_STAGING_DB_URL }}
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
          # One of the workflow's own choices, never free text.
          FORMATION: ${{ inputs.formation }}
        run: |
          # Only ever petroleum-staging, as Deploy staging checks it (F-247-1-R10-02).
          ref=ubgyatbzjctsgzcsvwgc
          pooler="^postgres(ql)?://postgres\.${ref}:[^@:/?#]+@aws-1-us-east-2\.pooler\.supabase\.com:5432/postgres$"
          direct="^postgres(ql)?://postgres:[^@:/?#]+@db\.${ref}\.supabase\.co:5432/postgres$"
          if ! [[ "$PETROLEUM_STAGING_DB_URL" =~ $pooler || "$PETROLEUM_STAGING_DB_URL" =~ $direct ]]; then
            echo "::error::PETROLEUM_STAGING_DB_URL is not petroleum-staging's postgres login in the expected form; nothing was loaded."
            exit 1
          fi
          if [ -z "$SUPABASE_STAGING_DB_URL" ]; then
            echo "::error::SUPABASE_STAGING_DB_URL is not set: grain's database size cannot be checked, so nothing was loaded."
            exit 1
          fi
          version=$(psql "$PETROLEUM_STAGING_DB_URL" -tA -c "select petro.schema_version()")
          if [ "$version" -lt 16 ]; then
            echo "::error::The oil and gas database is at schema version $version; run Deploy staging first (it needs 16)."
            exit 1
          fi
          [[ "$FORMATION" =~ ^[a-z][a-z_]{1,39}$ ]] || { echo "::error::Unexpected formation name."; exit 1; }
          # The box around the play's wells, as its latest load recorded it.
          box=$(psql "$PETROLEUM_STAGING_DB_URL" -tA -F ' ' -c "select west, south, east, north from petro.st37_loads where formation = '$FORMATION' order by id desc limit 1")
          if [ -z "$box" ]; then
            echo "::error::No wells of that play in the oil and gas database: run Load ST37 wells first."
            exit 1
          fi
          read -r west south east north <<< "$box"
          # Widened to hold the play's outline, where the map draws one, as the land and the sales
          # are (F-264, F-276).
          outline="apps/web/public/outlines/$FORMATION.geojson"
          if [ -f "$outline" ]; then
            wide=$(node --experimental-strip-types scripts/load-land-sales.js area "$west" "$south" "$east" "$north" "$outline")
            read -r west south east north <<< "$wide"
          fi
          {
            echo "WEST=$west"
            echo "SOUTH=$south"
            echo "EAST=$east"
            echo "NORTH=$north"
          } >> "$GITHUB_ENV"
          grain=$(psql "$SUPABASE_STAGING_DB_URL" -tA -c "select pg_database_size(current_database())")
          echo "GRAIN_BYTES=$grain" >> "$GITHUB_ENV"
          echo "Area: $west $south $east $north. Grain's database: $((grain / 1048576)) MB."
      - name: Download the AER's pipeline file
        run: |
          mkdir -p "$RUNNER_TEMP/pipelines"
          cd "$RUNNER_TEMP/pipelines"
          # Redirects are not followed: only the AER's own address is fetched. The file was
          # 168 MB on 2026-11-22.
          curl -sS --fail --max-time 1200 --max-filesize 419430400 -D headers.txt \
            -o pipelines.zip https://static.aer.ca/prd/data/pipeline/Pipelines_SHP.zip
          unzip -q -o -j pipelines.zip \
            'Pipelines_SHP/Pipelines_GCS_NAD83.shp' 'Pipelines_SHP/Pipelines_GCS_NAD83.dbf'
          rm pipelines.zip
          # The file's own date, from its Last-Modified, as YYYY-MM-DD; "-" when there is none.
          modified=$(grep -i '^last-modified:' headers.txt | head -1 | cut -d' ' -f2- | tr -d '\r')
          day=$(date -u -d "$modified" +%F 2>/dev/null || echo -)
          [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || day=-
          echo "FILE_DATE=$day" >> "$GITHUB_ENV"
          echo "The AER's pipeline file of $day."
      - name: Load the pipelines
        env:
          PETROLEUM_STAGING_DB_URL: ${{ secrets.PETROLEUM_STAGING_DB_URL }}
        run: |
          dir="$RUNNER_TEMP/pipelines"
          node --max-old-space-size=4096 --experimental-strip-types scripts/load-pipelines.js sql \
            "$dir/Pipelines_GCS_NAD83.shp" "$dir/Pipelines_GCS_NAD83.dbf" \
            "$WEST" "$SOUTH" "$EAST" "$NORTH" "$GRAIN_BYTES" "$FILE_DATE" > "$dir/load.sql"
          psql "$PETROLEUM_STAGING_DB_URL" -q -f "$dir/load.sql"
      - name: Remove the AER's files from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/pipelines"
