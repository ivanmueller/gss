name: Load land sales

# Run by hand from the Actions tab (Actions → Load land sales → Run workflow), after "Load ST37
# wells". Reads Alberta Energy and Minerals' public offerings of petroleum and natural gas
# rights (each sale's notice and results, XML files since 2003) from the department's page,
# places each parcel's land on the province's township grid, and loads the parcels lying in the
# area of one play's wells (the Duvernay first; the owner, 2026-11-21) into the oil and gas
# database (petroleum-staging), replacing the whole copy in one transaction (F-242,
# docs/FEATURES_OIL_GAS.md). Run again after a sale to bring in its results and new notices.
#
# The notices and accepted offers are published by the province under the Open Government
# Licence - Alberta (docs/DECISIONS.md, 2026-11-21). The files stay on the runner and in that
# database, never in the repository or the run's logs or artifacts. The load is refused if
# grain's and the oil and gas databases together would pass 400 MB (the free plan's limit is
# shared by both).
on:
  workflow_dispatch:
    inputs:
      formation:
        description: The play whose wells mark the area
        type: choice
        options:
          - duvernay
        default: duvernay
      first_year:
        description: The first year of sales to load (2003 at the earliest)
        default: '2003'

permissions:
  contents: read

concurrency:
  group: load-land-sales
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the databases
        env:
          PETROLEUM_STAGING_DB_URL: ${{ secrets.PETROLEUM_STAGING_DB_URL }}
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
          # One of the workflow's own choices, never free text.
          FORMATION: ${{ inputs.formation }}
          FIRST_YEAR: ${{ inputs.first_year }}
        run: |
          # Only ever petroleum-staging, as Deploy staging checks it (F-247-1-R10-02).
          ref=ubgyatbzjctsgzcsvwgc
          pooler="^postgres(ql)?://postgres\.${ref}:[^@:/?#]+@aws-1-us-east-2\.pooler\.supabase\.com:5432/postgres$"
          direct="^postgres(ql)?://postgres:[^@:/?#]+@db\.${ref}\.supabase\.co:5432/postgres$"
          if ! [[ "$PETROLEUM_STAGING_DB_URL" =~ $pooler || "$PETROLEUM_STAGING_DB_URL" =~ $direct ]]; then
            echo "::error::PETROLEUM_STAGING_DB_URL is not petroleum-staging's postgres login in the expected form; nothing was loaded."
            exit 1
          fi
          if [ -z "$SUPABASE_STAGING_DB_URL" ]; then
            echo "::error::SUPABASE_STAGING_DB_URL is not set: grain's database size cannot be checked, so nothing was loaded."
            exit 1
          fi
          # A year and nothing else reaches a command.
          [[ "$FIRST_YEAR" =~ ^20[0-9]{2}$ ]] || { echo "::error::The first year must be a year such as 2003."; exit 1; }
          echo "FIRST_YEAR=$FIRST_YEAR" >> "$GITHUB_ENV"
          version=$(psql "$PETROLEUM_STAGING_DB_URL" -tA -c "select petro.schema_version()")
          if [ "$version" -lt 10 ]; then
            echo "::error::The oil and gas database is at schema version $version; run Deploy staging first (it needs 10)."
            exit 1
          fi
          [[ "$FORMATION" =~ ^[a-z][a-z_]{1,39}$ ]] || { echo "::error::Unexpected formation name."; exit 1; }
          # The box around the play's wells, as its latest load recorded it.
          box=$(psql "$PETROLEUM_STAGING_DB_URL" -tA -F ' ' -c "select west, south, east, north from petro.st37_loads where formation = '$FORMATION' order by id desc limit 1")
          if [ -z "$box" ]; then
            echo "::error::No wells of that play in the oil and gas database: run Load ST37 wells first."
            exit 1
          fi
          read -r west south east north <<< "$box"
          {
            echo "WEST=$west"
            echo "SOUTH=$south"
            echo "EAST=$east"
            echo "NORTH=$north"
          } >> "$GITHUB_ENV"
          grain=$(psql "$SUPABASE_STAGING_DB_URL" -tA -c "select pg_database_size(current_database())")
          echo "GRAIN_BYTES=$grain" >> "$GITHUB_ENV"
          echo "Area: $west $south $east $north. Grain's database: $((grain / 1048576)) MB."
      - name: Read the township grid
        run: |
          mkdir -p "$RUNNER_TEMP/land-sales/files"
          node --experimental-strip-types scripts/load-land-sales.js sections \
            "$WEST" "$SOUTH" "$EAST" "$NORTH" "$RUNNER_TEMP/land-sales/sections.ndjson"
      - name: Read each sale's notice and results
        run: |
          node --experimental-strip-types scripts/load-land-sales.js fetch \
            "$RUNNER_TEMP/land-sales/files" "$FIRST_YEAR"
      - name: Load the parcels
        env:
          PETROLEUM_STAGING_DB_URL: ${{ secrets.PETROLEUM_STAGING_DB_URL }}
        run: |
          node --experimental-strip-types scripts/load-land-sales.js sql \
            "$RUNNER_TEMP/land-sales/files" "$RUNNER_TEMP/land-sales/sections.ndjson" \
            "$WEST" "$SOUTH" "$EAST" "$NORTH" "$GRAIN_BYTES" > "$RUNNER_TEMP/land-sales/load.sql"
          psql "$PETROLEUM_STAGING_DB_URL" -q -f "$RUNNER_TEMP/land-sales/load.sql"
      - name: Remove the province's files from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/land-sales"
