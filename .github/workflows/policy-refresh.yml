name: Merge policy refresh

# When the merge rules change on main, a "Merge policy" pass recorded under the old rules must not merge
# anything (F-151-D1-02). This turns automatic merging off on every open pull request into main and says
# why; Claude then has each one checked again under the new rules (a new event) before turning it back
# on (docs/AI_WORKFLOW.md §11.6). It runs main's own copy (push to main) and reads no pull request code.
# It is the backstop: an approved rules change already withdraws automatic merging from the others in
# its own Merge policy run, before it merges (F-151-R1-01). The paths are RULE_PATHS in
# scripts/review-register.js.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/review-*'
      - '.github/workflows/merge-policy.yml'
      - '.github/workflows/review-evidence.yml'
      - '.github/workflows/policy-refresh.yml'

permissions:
  contents: read

jobs:
  refresh:
    name: Withdraw automatic merging until re-checked
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To turn automatic merging off and say why.
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      # main's own copy of the script (this push).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Turn automatic merging off on open pull requests into main
        run: |
          bash scripts/review-withdraw-auto.sh "$REPO" "The merge rules changed on main (${SHA:0:7}), so this pull request's earlier Merge policy result no longer counts. Automatic merging is off until the Merge policy runs again under the new rules (any new event: a push, or the pull request reopened)."
